services:
  # Sole writer of the shared worlds venv (mwgg_venv). Installs the mwgg_igdb
  # "ao" index, every world, and the worlds' requirements into the bind mount,
  # then exits 0. Every other service mounts the venv read-only, runs with
  # SKIP_ALL_INSTALLS=1, and waits on this via service_completed_successfully.
  # Refresh on demand:  docker compose up mwgg_upgrader
  mwgg_upgrader:
    image: ${MULTIWORLD_IMAGE:-ghcr.io/multiworldgg/multiworldgg:latest}
    entrypoint: python tools/mwgg_upgrade.py
    # Run-once populate/refresh job — not a long-running service.
    restart: "no"
    volumes:
      - app_volume:/app
      # The ONLY service that mounts the worlds venv read-write.
      - /var/lib/mwgg:/root/.local/share/MultiworldGG/

  multiworld:
    # Default: pull the published image from GHCR. Operator can override the
    # image ref via $MULTIWORLD_IMAGE (set in a .env file or shell env).
    # For local dev, run `docker compose build` to rebuild from source — that
    # produces a local image tagged with the same name and `up` will use it.
    image: ${MULTIWORLD_IMAGE:-ghcr.io/multiworldgg/multiworldgg:latest}
    build:
      context: ..
    # Launch main process without website hosting (config override)
    entrypoint: python WebHost.py --config_override selflaunch.yaml
    environment:
      # Cap glibc malloc arenas for this process and every Generator/MultiHoster
      # child it spawns (children inherit env), curbing RSS growth/fragmentation.
      - MALLOC_ARENA_MAX=2
      # Pure consumer of the venv: never installs, just reads.
      - SKIP_ALL_INSTALLS=1
    volumes:
      # Mount application volume
      - app_volume:/app

      # Mount configs
      - ./example_config.yaml:/app/config.yaml
      - ./example_selflaunch.yaml:/app/selflaunch.yaml

      # Worlds venv — read-only; mwgg_upgrader is the sole writer.
      - /var/lib/mwgg:/root/.local/share/MultiworldGG/:ro

    # Don't host until the worlds venv is fully populated.
    depends_on:
      mwgg_upgrader:
        condition: service_completed_successfully

    # Expose on host network for access to dynamically mapped ports
    network_mode: host

  web:
    # Same image as multiworld service — both pull from GHCR by default, both
    # honor $MULTIWORLD_IMAGE override. Only the multiworld service has the
    # `build:` block so `docker compose build` only rebuilds once.
    image: ${MULTIWORLD_IMAGE:-ghcr.io/multiworldgg/multiworldgg:latest}
    # Wait for the worlds venv to be fully populated before serving.
    depends_on:
      mwgg_upgrader:
        condition: service_completed_successfully
      nudenet:
        condition: service_healthy
    # Launch gunicorn targeting WebHost application
    entrypoint: gunicorn -c gunicorn.conf.py
    volumes:
      # Mount application volume
      - app_volume:/app

      # Mount configs
      - ./example_config.yaml:/app/config.yaml
      - ./example_gunicorn.conf.py:/app/gunicorn.conf.py

      # Worlds venv — read-only; mwgg_upgrader is the sole writer.
      - /var/lib/mwgg:/root/.local/share/MultiworldGG/:ro

    # Operator must copy example_web.env to web.env (chmod 0600, gitignored)
    # and fill in MWGG_SECRET_KEY (and optionally MWGG_WEBAUTHN_HANDLE_SECRET)
    # before bringing this service up. The webhost refuses to start if
    # SECRET_KEY is still the hostname-derived default.
    env_file:
      - ./web.env

    environment:
      # Bind gunicorn on 8000
      - PORT=8000
      # Pure consumer of the venv: never installs, just reads.
      - SKIP_ALL_INSTALLS=1
      # Screen avatar uploads against the nudenet sidecar before storage.
      - AVATAR_NSFW_ENDPOINT=http://nudenet:8080/infer

  # NudeNet content-moderation sidecar. Screens avatar uploads for exposed
  # nudity (see WebHostLib/api/avatar.py). Internal-only: the web service reaches
  # it as http://nudenet:8080/infer over the compose network; no host port is
  # published (the host's 8080 belongs to nginx).
  nudenet:
    # Registry publishes only a floating `latest` (linux/amd64); no version tags.
    image: ghcr.io/notai-tech/nudenet:latest
    restart: unless-stopped
    # The image CMD is `ulimit -n 1000000 && <loop worker> & <rest server>`.
    # In sh, `&&` binds tighter than `&`, so a failed `ulimit` short-circuits
    # and the inference loop never starts — the REST server stays up with no
    # worker behind it, /infer hangs, and the web caller times out at 10s
    # ("Content moderation unavailable"). Grant a high nofile limit (the daemon
    # can raise the hard limit) so the in-container `ulimit -n 1000000` succeeds
    # and the loop actually launches.
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    environment:
      # Cap glibc malloc arenas (gthread workers spawn several). Without this,
      # freed memory is retained per-arena and RSS climbs/fragments; 2 arenas
      # keeps the web worker returning memory to the OS.
      - MALLOC_ARENA_MAX=2
    # fastDeploy binds :8080 only after the loop worker finishes warmup / its
    # batch-size search — the REST app blocks on import until then (see
    # __main__.py `rest()` -> `from ._app import app`), so a successful TCP
    # connect is an honest "ready to moderate" signal. The image base is
    # python:3.10-slim (python3 present; no curl/wget). start_period is generous
    # to cover slow CPU warmup without flapping to unhealthy.
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 2).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s

  nginx:
    image: nginx:stable-alpine
    volumes:
      # Mount application volume
      - app_volume:/app

      # Mount config
      - ./example_nginx.conf:/etc/nginx/nginx.conf
    ports:
      # Nginx listening internally on port 80 -- mapped to 8080 on host
      - 8080:80
    depends_on:
      - web

  # MWGG GitHub-bot: webhook receiver running both the Oliver and Karen GitHub
  # App identities. Publishes port 3000 to the host's loopback only
  github-bots:
    # Default: pull the published image from GHCR. Override via
    # $MWGG_GITHUB_BOT_IMAGE for forks / non-`MultiworldGG` registries.
    # For local dev, run `docker compose build mwgg-github-bot` to rebuild.
    image: ${MWGG_GITHUB_BOT_IMAGE:-ghcr.io/multiworldgg/multiworldgg-bots:latest}
    build:
      context: ../GitHubLib
    env_file:
      # Operator must copy example_github-bot.env to github-bot.env (chmod 0600)
      # and fill in OLIVER_APP_ID + KAREN_APP_ID + the private keys + webhook
      # secret before bringing this up.
      - ./github-bot.env
    volumes:
      # Bind-mount a host directory of secret files at /run/secrets so the
      # OLIVER_*_FILE / KAREN_*_FILE env vars (in github-bot.env) can point
      # at them. Directory must be chmod 0700
      #   github-bot-secrets/oliver_app_id            # one-line numeric App ID
      #   github-bot-secrets/oliver_private_key.pem   # full PEM
      #   github-bot-secrets/oliver_webhook_secret    # one-line hex string
      #   github-bot-secrets/karen_app_id
      #   github-bot-secrets/karen_private_key.pem
      #   github-bot-secrets/karen_webhook_secret    # one-line hex string
      - ./github-bot-secrets:/run/secrets:ro
      # Persistent JSONL log of bot events (success/skip/error). Survives
      # container restarts; surfaced at https://oliver.multiworld.gg/status.
      - github_bots_state:/var/lib/oliver
      # Fuzz scratch dir. The bot creates <FUZZ_WORK_DIR>/<id>/out, reads the
      # container's result.json from it, and bind-mounts it into each fuzz
      # container as /out. That inner `docker run -v` is resolved by the HOST
      # daemon (via the socket-proxy), so it must be a real HOST path — mounting
      # /var/lib/mwgg-fuzz at the IDENTICAL path here makes the bot's view and
      # the daemon's view agree.
      - /var/lib/mwgg-fuzz:/var/lib/mwgg-fuzz
    environment:
      # Talk to the host Docker daemon through the socket-proxy sidecar, never
      # the raw socket. The fuzz runner honors DOCKER_HOST and never passes -H.
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      # ---- Fuzz container spawning (Karen karen-fuzz) ----------------------
      # Work dir for per-job out mounts. MUST equal the host path bind-mounted
      # above so `docker run -v` resolves on the host daemon.
      - FUZZ_WORK_DIR=/var/lib/mwgg-fuzz
      # Image the bot spawns per world to scan + fuzz a bind-mounted wheel,
      # OFFLINE (--network none). Core/venv/fuzz.py are baked into it at build.
      - FUZZ_IMAGE=${FUZZ_IMAGE:-ghcr.io/multiworldgg/multiworldgg-fuzz:latest}
      # At most this many fuzz containers run concurrently (clamped to >= 1).
      - FUZZ_MAX_CONCURRENCY=1
      # Per-container resource caps (passed straight to `docker run`).
      - FUZZ_CPUS=2
      - FUZZ_MEMORY=4g
      - FUZZ_PIDS=512
      # Node-side wall-clock budget per container; on expiry it is force-removed.
      - FUZZ_WALL_SECONDS=1200
      # NOTE: the fuzz container runs with `--network none`. Core, its venv, and
      # fuzz.py are baked into FUZZ_IMAGE at build time, and the bot downloads +
      # verifies the wheel and bind-mounts it in — so there is NO FUZZ_NET /
      # FUZZ_WHEEL_HOSTS / MWGG_CORE_* / FUZZER_* (and no egress bridge/firewall)
      # to configure. Rebuild the image to pick up a newer core/fuzzer pin.
      # Optional ROM support (read-only). ROM-dependent worlds (e.g. metroidfusion)
      # only generate if the base ROMs are present. Set these to HOST paths and
      # the bot adds them to the inner `docker run` as READ-ONLY mounts (/roms +
      # the host.yaml). They are resolved by the host daemon, NOT read by the bot,
      # so — unlike FUZZ_WORK_DIR — they need NOT be bind-mounted into this
      # container. host.yaml's <world>_options.rom_file entries may be absolute
      # (/roms/<file>) or relative (roms/<file>, which the run script links to the
      # mount) so the SAME host.yaml also drives real generation; the ROMs must be
      # readable by uid 65532. Untrusted world
      # code can READ (not write) the ROMs, but the container has NO network, so
      # they can't be exfiltrated. Leave unset to keep ROM worlds as warn/no-ops.
      # - FUZZ_ROM_DIR=/var/lib/mwgg-fuzz-roms
      # - FUZZ_HOST_YAML=/var/lib/mwgg-fuzz-host.yaml
      # Debug diagnostics (off by default). When set truthy, each fuzz container
      # copies its FULL combined log and the fuzzer's per-generation worker dumps
      # (tracebacks + failing YAMLs) into the job's /out, and the bot KEEPS the
      # per-job dir instead of deleting it. Inspect after a failing run at:
      #   /var/lib/mwgg-fuzz/<id>/out/{result.json,report.json,combined.log,fuzz_output/}
      # result.json only ever holds the last ~4KB of the log and no worker
      # tracebacks, so this is how you see WHY a generation actually failed.
      # Dirs accumulate while on — turn it back off and clean /var/lib/mwgg-fuzz
      # when done.
      # - FUZZ_DEBUG=1
    # Karen reaches the daemon proxy by service name over the compose network.
    depends_on:
      - docker-socket-proxy
    ports:
      # Loopback-only
      - "127.0.0.1:3000:3000"
      - "[::1]:3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/probot"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Pull-only helper — NOT a runtime service. github-bots spawns the fuzz image
  # ad-hoc via `docker run`, so `docker compose pull` never fetches it (it isn't
  # a service). This entry makes `docker compose pull` grab it too; `docker run`
  # later finds it already local. `entrypoint: ["true"]` makes it exit 0 at once
  # if `up` ever starts it, and it never restarts. Keep its image expression
  # IDENTICAL to the github-bots FUZZ_IMAGE above so both resolve to the same ref.
  # Run `docker compose pull` (authenticated) BEFORE `up` so the image is local.
  fuzz-image:
    image: ${FUZZ_IMAGE:-ghcr.io/multiworldgg/multiworldgg-fuzz:latest}
    entrypoint: ["true"]
    restart: "no"

  # Docker API proxy in front of the host's /var/run/docker.sock.
  #
  # SECURITY: handing the internet-facing bot the raw docker.sock is effectively
  # host root (it could create a container that bind-mounts / ). This proxy
  # (tecnativa/docker-socket-proxy — HAProxy over the daemon API) exposes ONLY
  # the API sections enabled below and mounts the socket READ-ONLY into ITSELF;
  # the bot never sees the socket and reaches the proxy over the compose network
  # via DOCKER_HOST=tcp://docker-socket-proxy:2375. No host port is published.
  #
  # tecnativa gates per-SECTION (not per-verb): CONTAINERS + IMAGES + POST cover
  # the create/start/wait/attach/remove the runner's `docker run --rm` + timeout
  # `docker rm -f` need, while EXEC, BUILD, SWARM, NETWORKS, VOLUMES, SYSTEM,
  # etc. stay denied (every other section defaults to 0). NOTE: confirm your
  # proxy image/version permits container removal (the timeout cleanup path);
  # env-var names vary across versions.
  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  # Share application directory amongst multiworld and web services
  # (for access to log files and the like), and nginx (for static files)
  app_volume:
  # GitHub-bot's events.jsonl log
  github_bots_state:
