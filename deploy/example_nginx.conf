worker_processes 1;

user nobody nogroup;
# 'user nobody nobody;' for systems with 'nobody' as a group instead
error_log  /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024; # increase if you have lots of clients
  accept_mutex off; # set to 'on' if nginx worker_processes > 1
  # 'use epoll;' to enable for Linux 2.6+
  # 'use kqueue;' to enable for FreeBSD, OSX
  use epoll;
}

http {
  include mime.types;
  # fallback in case we can't determine a type
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log combined;
  sendfile on;

  upstream app_server {
    # fail_timeout=0 means we always retry an upstream even if it failed
    # to return a good HTTP response

    # for UNIX domain socket setups
    # server unix:/tmp/gunicorn.sock fail_timeout=0;

    # for a TCP configuration
    server web:8000 fail_timeout=0;
  }

  server {
    # use 'listen 80 deferred;' for Linux
    # use 'listen 80 accept_filter=httpready;' for FreeBSD
    listen 80 deferred;
    client_max_body_size 4G;

    # set the correct host(s) for your site
    # server_name example.com www.example.com;

    keepalive_timeout 5;
    
    location / {
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host $http_host;
      # we don't want nginx trying to do something clever with
      # redirects, we set the Host: header above already.
      proxy_redirect off;

      proxy_pass http://app_server;
      proxy_intercept_errors on;
      error_page 500 =500 @custom_500;
      error_page 502 =502 @custom_502;
      error_page 503 =503 @custom_503;
      error_page 504 =504 @custom_504;
      error_page 404 =404 @custom_404;
    }

    location @custom_500 {
      add_header Retry-After 300 always;

      root /opt/mwgg_www;
      try_files /500.html =500;
    }
    location @custom_502 {
      add_header Retry-After 300 always;

      root /opt/mwgg_www;
      try_files /502.html =502;
    }
    location @custom_503 {
      add_header Retry-After 300 always;

      root /opt/mwgg_www;
      try_files /503.html =503;
    }
    location @custom_504 {
      add_header Retry-After 300 always;

      root /opt/mwgg_www;
      try_files /504.html =504;
    }

    location @custom_404 {
      root /opt/mwgg_www;
      try_files /404.html =404;
    }

    location /static/ {
      alias /static/;
      autoindex off;
    }

    location /avatar/ {
      alias /uploads/avatars/;
      autoindex off;
      try_files $uri =404;
      expires 7d;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    location = /favicon.ico {
      alias /static/static/favicon.ico;
      access_log off;
    }
  }
}
