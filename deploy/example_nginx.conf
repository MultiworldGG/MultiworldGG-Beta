worker_processes 1;

user nobody nogroup;
# 'user nobody nobody;' for systems with 'nobody' as a group instead
error_log  /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024; # increase if you have lots of clients
  accept_mutex off; # set to 'on' if nginx worker_processes > 1
  # 'use epoll;' to enable for Linux 2.6+
  # 'use kqueue;' to enable for FreeBSD, OSX
  use epoll;
}

http {
  include mime.types;
  # fallback in case we can't determine a type
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log combined;
  sendfile on;

  upstream app_server {
    # fail_timeout=0 means we always retry an upstream even if it failed
    # to return a good HTTP response

    # for UNIX domain socket setups
    # server unix:/tmp/gunicorn.sock fail_timeout=0;

    # for a TCP configuration
    server web:8000 fail_timeout=0;
  }

  server {
    # use 'listen 80 deferred;' for Linux
    # use 'listen 80 accept_filter=httpready;' for FreeBSD
    listen 80 deferred;
    client_max_body_size 4G;

    # set the correct host(s) for your site
    # server_name example.com www.example.com;

    keepalive_timeout 5;
    
    # Branded pages for errors NGINX generates itself (upstream down or timed
    # out, or a miss in a location nginx serves directly). App-generated errors
    # pass through untouched; enabling proxy_intercept_errors would replace the
    # app's own styled error pages, so leave it off. 50x.html is a catch-all for
    # anyone who does turn interception on (error_page 500 502 503 504 ... ).
    error_page 502 /__error/502.html;
    error_page 503 /__error/503.html;
    error_page 504 /__error/504.html;
    error_page 404 /__error/404.html;

    location ^~ /__error/ {
      internal;
      alias /app/deploy/error_pages/;
    }

    location / {
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host $http_host;
      # we don't want nginx trying to do something clever with
      # redirects, we set the Host: header above already.
      proxy_redirect off;

      proxy_pass http://app_server;
    }

    location /static/ {
      root /app/WebHostLib/;
      autoindex off;
    }

    location /avatar/ {
      alias /app/uploads/avatars/;
      autoindex off;
      try_files $uri =404;
      expires 7d;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    location = /favicon.ico {
      alias /app/WebHostLib/static/static/favicon.ico;
      access_log off;
    }
  }
}
